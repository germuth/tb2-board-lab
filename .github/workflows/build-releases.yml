name: Build Desktop Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os_label: Windows
            artifact_name: TB2-Board-Lab-Windows
            add_data_sep: ";"
          - runner: macos-latest
            os_label: macOS
            artifact_name: TB2-Board-Lab-macOS
            add_data_sep: ":"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build standalone bundle with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onedir \
            --name TB2-Board-Lab \
            --paths . \
            --hidden-import catalog_engine \
            --add-data "static${{ matrix.add_data_sep }}static" \
            server.py

      - name: Copy docs into bundle
        shell: bash
        run: |
          cp README.md LICENSE dist/TB2-Board-Lab/

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/TB2-Board-Lab" -DestinationPath "${{ matrix.artifact_name }}.zip" -Force

      - name: Package macOS zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          (cd dist && zip -r "../${{ matrix.artifact_name }}.zip" TB2-Board-Lab)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach zips to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
          generate_release_notes: true
